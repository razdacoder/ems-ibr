name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres is required (no SQLite fallback). ORDO_TESTING switches the
    # suite to an in-memory channel layer, so Redis isn't needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ordo
          POSTGRES_PASSWORD: ordo
          POSTGRES_DB: ordo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ordo:ordo@localhost:5432/ordo
      ORDO_TESTING: "1"
      SECRET_KEY: ci-only
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same Python as the runtime image (Dockerfile).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test ems tenancy --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Version comes from package.json's "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc -b plus the Vite production build, same as the Dockerfile.
      - name: Type check and build
        run: pnpm run build
