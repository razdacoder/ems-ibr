<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f6f5f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1b19;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5f2;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e4dd;border-radius:12px;">
        <tr><td style="padding:28px 32px 8px;font-size:18px;font-weight:600;letter-spacing:-0.01em;">Ordo</td></tr>
        <tr><td style="padding:8px 32px 28px;font-size:15px;line-height:1.6;">
          {% block body %}{% endblock %}
        </td></tr>
      </table>
      <p style="max-width:520px;margin:16px auto 0;font-size:12px;line-height:1.5;color:#7a766d;">
        {% block footer %}You're getting this because someone added your email to Ordo. If you weren't expecting it, you can ignore it.{% endblock %}
      </p>
    </td></tr>
  </table>
</body>
</html>
